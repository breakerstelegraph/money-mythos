<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>05-f5</title>
  </head>
  <body>
    <template>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
        href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet"
      />
      <style>
        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          background: #111111;
          font-family: "Barlow", "Helvetica Neue", Arial, sans-serif;
        }
        .f5-group {
          position: absolute;
          inset: 0;
        }

        /* ── g1 · card-flyby (orange register) ─────────────────────────── */
        .f5-g1-ground {
          position: absolute;
          inset: 0;
          background: #e85d26;
        }
        .f5-g1-stage {
          position: absolute;
          inset: 0;
          perspective: 2400px;
          perspective-origin: 50% 55%;
        }
        .f5-g1-scene {
          position: absolute;
          inset: 0;
          transform-style: preserve-3d;
        }
        .f5-g1-card {
          position: absolute;
          left: calc(50% - 620px);
          top: calc(50% - 350px);
          width: 1240px;
          height: 700px;
          --wipe: 0;
          transform-origin: 50% 50%;
          will-change: transform, opacity;
        }
        .f5-g1-wire {
          position: absolute;
          inset: 0;
          border: 1px solid rgba(17, 17, 17, 0.55);
          background: rgba(17, 17, 17, 0.02);
          overflow: hidden;
        }
        .f5-g1-num {
          position: absolute;
          left: 48px;
          top: 40px;
          font-family: "IBM Plex Mono", monospace;
          font-size: 20px;
          font-weight: 500;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: rgba(17, 17, 17, 0.55);
        }
        .f5-g1-hbar {
          position: absolute;
          left: 48px;
          right: 48px;
          bottom: 44px;
          height: 1px;
          background: rgba(17, 17, 17, 0.3);
        }
        .f5-g1-solid {
          position: absolute;
          inset: 0;
          background: #111111;
          overflow: hidden;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 70px 90px;
          clip-path: polygon(
            0% 0%,
            calc(var(--wipe) * 200% - 30%) 0%,
            calc(var(--wipe) * 200% - 80%) 100%,
            0% 100%
          );
        }
        .f5-g1-title {
          font-family: "Barlow", sans-serif;
          font-weight: 900;
          letter-spacing: -0.04em;
          line-height: 0.94;
          color: #f0ece5;
          text-align: center;
          text-transform: lowercase;
          max-width: 100%;
          overflow-wrap: break-word;
        }

        /* ── g2 · held-text-strobe-burst (dark register) ────────────────── */
        .f5-g2-base,
        .f5-g2-look {
          position: absolute;
          inset: 0;
          background: #111111;
        }
        .f5-g2-look {
          opacity: 0;
        }
        .f5-g2-wordwrap {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 0 120px;
        }
        .f5-g2-word {
          font-family: "Barlow", sans-serif;
          font-weight: 900;
          letter-spacing: -0.04em;
          line-height: 0.94;
          font-size: 128px;
          text-transform: lowercase;
          text-align: center;
          color: #f0ece5;
          max-width: 1600px;
        }
        .f5-g2-look .f5-g2-word {
          color: #e85d26;
        }

        /* ── g3 · typewriter-phrase-keyword-shuffle (dark register) ─────── */
        .f5-g3-bg {
          position: absolute;
          inset: 0;
          background: #111111;
        }
        .f5-g3-line-wrap {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .f5-g3-line {
          display: inline-flex;
          align-items: baseline;
          flex-wrap: wrap;
          justify-content: center;
          gap: 0.28em;
          max-width: 80%;
        }
        .f5-g3-word {
          display: inline-block;
          font-family: "Barlow", sans-serif;
          font-weight: 800;
          letter-spacing: -0.02em;
          font-size: 112px;
          color: #f0ece5;
          text-transform: lowercase;
        }
        .f5-g3-cword {
          display: inline-flex;
          align-items: baseline;
        }
        .f5-g3-keyword {
          display: inline-block;
          font-family: "Barlow", sans-serif;
          font-weight: 800;
          letter-spacing: -0.02em;
          font-size: 112px;
          color: #e85d26;
          text-transform: lowercase;
        }
        .f5-g3-period {
          display: inline-block;
          font-family: "Barlow", sans-serif;
          font-weight: 800;
          color: #e85d26;
        }
      </style>

      <div id="root" data-composition-id="05-f5" data-width="1920" data-height="1080" data-duration="13.0">
        <!-- ═══════════ g1 · card-flyby (orange, local 0 – 6.55) ═══════════ -->
        <div id="f5-g1" class="f5-group">
          <div class="f5-g1-ground"></div>
          <div class="f5-g1-stage">
            <div class="f5-g1-scene" id="f5-g1-scene"></div>
          </div>
        </div>

        <!-- ═══════════ g2 · held-text-strobe-burst (dark, local 6.55 – 9.0) ═══ -->
        <div id="f5-g2" class="f5-group">
          <div class="f5-g2-base">
            <div class="f5-g2-wordwrap">
              <div class="f5-g2-word">pigs get slaughtered</div>
            </div>
          </div>
          <div class="f5-g2-look" id="f5-g2-look">
            <div class="f5-g2-wordwrap">
              <div class="f5-g2-word">pigs get slaughtered</div>
            </div>
          </div>
        </div>

        <!-- ═══════════ g3 · typewriter-phrase-keyword-shuffle (dark, local 9.0 – 13.0) ═══ -->
        <div id="f5-g3" class="f5-group">
          <div class="f5-g3-bg"></div>
          <div class="f5-g3-line-wrap">
            <div class="f5-g3-line" id="f5-g3-line">
              <span class="f5-g3-word" id="f5-g3-w0">sheep</span>
              <span class="f5-g3-word" id="f5-g3-w1">follow</span>
              <span class="f5-g3-cword" id="f5-g3-kw">
                <span class="f5-g3-keyword" id="f5-g3-keyword">the drama</span><span
                  class="f5-g3-period"
                  id="f5-g3-period"
                  >.</span
                >
              </span>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          // ═══════════════════════════════════════════════════════════════
          //  05-f5 — dense rebuild punctuated by two hard stops (68s, 72s)
          //  g1 [0, 6.55]  card-flyby, orange register
          //  g2 [6.55, 9.0]  held-text-strobe-burst, dark register
          //  g3 [9.0, 13.0]  typewriter-phrase-keyword-shuffle, dark register
          // ═══════════════════════════════════════════════════════════════

          var G1_START = 0,
            G1_END = 6.55,
            G2_START = 6.55,
            G2_END = 9.0,
            G3_START = 9.0,
            G3_END = 13.0;

          var tl = gsap.timeline({ paused: true });

          // ── group visibility (0ms hard swaps = the group→group cut) ─────
          gsap.set("#f5-g1", { autoAlpha: 1 });
          gsap.set("#f5-g2", { autoAlpha: 0 });
          gsap.set("#f5-g3", { autoAlpha: 0 });
          tl.set("#f5-g1", { autoAlpha: 1 }, G1_START);
          tl.set("#f5-g2", { autoAlpha: 0 }, G1_START);
          tl.set("#f5-g3", { autoAlpha: 0 }, G1_START);
          tl.set("#f5-g1", { autoAlpha: 0 }, G1_END);
          tl.set("#f5-g2", { autoAlpha: 1 }, G2_START);
          tl.set("#f5-g2", { autoAlpha: 0 }, G2_END);
          tl.set("#f5-g3", { autoAlpha: 1 }, G3_START);

          // ═══════════════════ g1 · card-flyby ═════════════════════════════
          (function () {
            var CARDS = ["bulls", "run it up", "bears", "bringing the trauma"];
            // landings, frame-local (abs 61.74/62.95/64.11/65.39 − 59.0)
            var LANDED = [2.74, 3.95, 5.11, 6.39];
            var N = CARDS.length;
            var YAW = 12;

            var scene = document.getElementById("f5-g1-scene");
            scene.style.transform = "rotateY(" + YAW + "deg)";

            function fontSizeFor(title) {
              if (title.length <= 6) return 190;
              if (title.length <= 10) return 128;
              return 96;
            }

            var cardEls = [];
            for (var i = 0; i < N; i++) {
              var card = document.createElement("div");
              card.className = "f5-g1-card";
              card.id = "f5-g1-card-" + i;

              var wire = document.createElement("div");
              wire.className = "f5-g1-wire";
              var num = document.createElement("div");
              num.className = "f5-g1-num";
              num.textContent = String(i + 1).padStart(2, "0") + " / " + String(N).padStart(2, "0");
              wire.appendChild(num);
              var hbar = document.createElement("div");
              hbar.className = "f5-g1-hbar";
              wire.appendChild(hbar);
              card.appendChild(wire);

              var solid = document.createElement("div");
              solid.className = "f5-g1-solid";
              var title = document.createElement("div");
              title.className = "f5-g1-title";
              title.textContent = CARDS[i];
              title.style.fontSize = fontSizeFor(CARDS[i]) + "px";
              solid.appendChild(title);
              card.appendChild(solid);

              scene.appendChild(card);
              cardEls.push(card);
            }

            // slot poses (geometry only — purely structural, palette-agnostic)
            var SLOT = {
              far: { x: 360, y: 380, z: -1080, rotX: 84, scale: 0.74, opacity: 0, zi: 60 },
              s3: { x: 280, y: 290, z: -820, rotX: 66, scale: 0.8, opacity: 0.32, zi: 70 },
              s2: { x: 195, y: 200, z: -560, rotX: 46, scale: 0.86, opacity: 0.58, zi: 80 },
              s1: { x: 105, y: 105, z: -290, rotX: 22, scale: 0.93, opacity: 0.85, zi: 90 },
              s0: { x: 0, y: 0, z: 0, rotX: 0, scale: 1.0, opacity: 1.0, zi: 100 },
              exit: { x: -90, y: 620, z: 420, rotX: -88, scale: 1.1, opacity: 0, zi: 110 },
            };
            function poseForRel(rel) {
              if (rel <= -1) return SLOT.exit;
              if (rel === 0) return SLOT.s0;
              if (rel === 1) return SLOT.s1;
              if (rel === 2) return SLOT.s2;
              if (rel === 3) return SLOT.s3;
              return SLOT.far;
            }
            function poseTween(idx, slot, t, dur, ease) {
              tl.set("#f5-g1-card-" + idx, { zIndex: slot.zi }, t);
              tl.to(
                "#f5-g1-card-" + idx,
                {
                  x: slot.x,
                  y: slot.y,
                  z: slot.z,
                  rotationX: slot.rotX,
                  scale: slot.scale,
                  opacity: slot.opacity,
                  force3D: true,
                  duration: dur,
                  ease: ease || "power2.inOut",
                },
                t,
              );
            }
            function transDur(i) {
              var gap = i === 0 ? LANDED[1] - LANDED[0] : LANDED[i] - LANDED[i - 1];
              return Math.max(0.12, Math.min(0.42, gap * 0.32));
            }

            // initial pose (nothing landed yet): card j at rel = j+1
            for (var j = 0; j < N; j++) {
              var s0 = poseForRel(j + 1);
              var props = {
                x: s0.x,
                y: s0.y,
                z: s0.z,
                rotationX: s0.rotX,
                scale: s0.scale,
                opacity: s0.opacity,
                zIndex: s0.zi,
                force3D: true,
                "--wipe": 0,
              };
              gsap.set("#f5-g1-card-" + j, props);
              tl.set("#f5-g1-card-" + j, props, G1_START);
            }

            for (var L = 0; L < N; L++) {
              var dur = transDur(L);
              var t = Math.max(G1_START, LANDED[L] - dur);
              for (var k = L - 1; k <= L + 4; k++) {
                if (k < 0 || k >= N) continue;
                var rel = k - L;
                var ease = rel === 0 ? "power3.out" : rel < 0 ? "power2.in" : "power2.inOut";
                poseTween(k, poseForRel(rel), t, dur, ease);
              }
              tl.to(
                "#f5-g1-card-" + L,
                { "--wipe": 1, duration: dur * 0.85, ease: "power2.inOut" },
                t + dur * 0.15,
              );
            }
          })();

          // ═══════════════════ g2 · held-text-strobe-burst ═════════════════
          (function () {
            // roll clipped to the group's own span end (68.0s abs = 9.0 local)
            // — a hard cut, not a soft fade — per the group-boundary rule.
            var ROLL_START = 6.875; // 65.875 − 59.0
            var ROLL_END = Math.min(9.383, G2_END); // 68.383 − 59.0, clipped to the group's hard end (9.0)
            var STEP = 0.1; // ~3 frames @ 30fps

            function gridJumps(start, end, step) {
              var out = [];
              var n = Math.max(0, Math.floor((end - start) / step + 1e-6) + 1);
              for (var i = 0; i < n; i++) out.push(+(start + i * step).toFixed(4));
              return out;
            }

            var jumps = gridJumps(ROLL_START, ROLL_END, STEP);
            var on = false;
            jumps.forEach(function (t) {
              on = !on;
              tl.set("#f5-g2-look", { opacity: on ? 1 : 0 }, t);
            });
          })();

          // ═══════════════════ g3 · typewriter-phrase-keyword-shuffle ══════
          (function () {
            var els = [
              document.getElementById("f5-g3-w0"),
              document.getElementById("f5-g3-w1"),
              document.getElementById("f5-g3-keyword"),
            ];
            var periodEl = document.getElementById("f5-g3-period");
            gsap.set(els.concat([periodEl]), { autoAlpha: 0 });

            var POP_IN = { autoAlpha: 0, scale: 0.92, y: 5 };
            var POP_OUT = { autoAlpha: 1, scale: 1, y: 0, duration: 0.1, ease: "back.out(2)" };

            // phrase onsets, frame-local (abs 68.1/68.71/70.64/71.61 minus 69.66 shuffle − 59.0)
            var T_SHEEP = 9.1; // 68.1 − 59.0
            var T_FOLLOW = 9.71; // 68.71 − 59.0
            var T_KEYWORD = 10.66; // 69.66 − 59.0  ("the drama" types in together)
            var T_SHUFFLE = 11.64; // 70.64 − 59.0  (percussive weight/scale punch)
            var T_PERIOD = 12.61; // 71.61 − 59.0

            tl.fromTo(els[0], POP_IN, POP_OUT, T_SHEEP);
            tl.fromTo(els[1], POP_IN, POP_OUT, T_FOLLOW);
            tl.fromTo(els[2], POP_IN, POP_OUT, T_KEYWORD);

            // keyword shuffle beat — Barlow has no serif companion in this
            // brand, so the "shuffle" is a percussive weight/scale punch
            // instead of a font-family swap.
            tl.set(els[2], { fontWeight: 900 }, T_SHUFFLE);
            tl.to(els[2], { scale: 1.1, duration: 0.08, ease: "power2.out" }, T_SHUFFLE);
            tl.to(els[2], { scale: 1, duration: 0.16, ease: "power3.out" }, T_SHUFFLE + 0.08);

            tl.fromTo(
              periodEl,
              { autoAlpha: 0, scale: 0.3 },
              { autoAlpha: 1, scale: 1, duration: 0.09, ease: "back.out(3)" },
              T_PERIOD,
            );
          })();

          // pin total duration to the frame span
          tl.to({}, { duration: G3_END }, 0);
          tl.seek(0);

          window.__timelines["05-f5"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
