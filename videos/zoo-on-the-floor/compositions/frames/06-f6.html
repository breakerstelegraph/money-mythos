      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });

          var CUT = 0.08;
          var CREAM = "#f0ece5";
          var FIRE = "#e85d26";

          // ── baseline: everything hidden ──
          gsap.set(["#g1", "#g2", "#g3"], { autoAlpha: 1 });
          gsap.set(["#g1_tile1", "#g1_tile2", "#g1_tile3"], { autoAlpha: 0, scale: 0.85 });
          gsap.set(["#g2_l1", "#g2_l2", "#g3_l1", "#g3_l2"], { opacity: 0 });
          gsap.set(".w", { opacity: 0 });
          gsap.set(["#g2_icon", "#g3_icon"], { opacity: 0 });
          gsap.set(document.querySelectorAll("#g2_icon .icon-glyph, #g3_icon .icon-glyph"), {
            scale: 0.4,
            rotation: -8,
            opacity: 0,
          });
          gsap.set(document.querySelectorAll("#g2_icon .ring, #g3_icon .ring"), {
            opacity: 0,
            scale: 0.4,
          });

          // reveal a line's words at explicit per-word times; hard-cut it out at `cutAt` (if given)
          function wireLineTimes(lineSel, times, cutAt) {
            var line = document.querySelector(lineSel);
            var words = line.querySelectorAll(".w");
            tl.set(lineSel, { opacity: 1 }, times[0]);
            words.forEach(function (w, i) {
              tl.to(
                w,
                { opacity: 1, duration: 0.16, ease: "power2.out", overwrite: "auto" },
                times[i],
              );
            });
            if (cutAt != null) {
              tl.to(
                lineSel,
                { opacity: 0, duration: CUT, ease: "power2.in", overwrite: "auto" },
                cutAt,
              );
            }
          }

          // pop the climax icon + expanding rings at `at` — tightened so it fully
          // settles well inside the group's own window (never a mid-motion cutoff
          // at the frame boundary, critical for g3 which ends the whole video).
          function wireIcon(prefix, at) {
            var icon = document.getElementById(prefix + "_icon");
            var glyph = icon.querySelector(".icon-glyph");
            var rings = icon.querySelectorAll(".ring");
            tl.to(icon, { opacity: 1, duration: 0.22, ease: "power3.out", overwrite: "auto" }, at);
            tl.fromTo(
              glyph,
              { scale: 0.4, rotation: -8, opacity: 0 },
              {
                scale: 1,
                rotation: 0,
                opacity: 1,
                duration: 0.3,
                ease: "back.out(2.4)",
                overwrite: "auto",
              },
              at + 0.05,
            );
            tl.to(
              glyph,
              { rotation: 12, duration: 0.08, ease: "power2.out", overwrite: "auto" },
              at + 0.35,
            );
            tl.to(
              glyph,
              { rotation: 0, duration: 0.45, ease: "power3.out", overwrite: "auto" },
              at + 0.43,
            );
            tl.fromTo(
              rings,
              { scale: 0.4, opacity: 0.5 },
              { scale: 1.4, opacity: 0, duration: 0.45, ease: "power2.out", stagger: 0.12 },
              at + 0.28,
            );
          }

          // recolor the wall as a unit — a hit, not a fade — with a punchy scale beat
          function recolorWall(t, bg) {
            var sel = ["#g1_tile1", "#g1_tile2", "#g1_tile3"];
            tl.set(sel, { backgroundColor: bg }, t);
            tl.to(sel, { scale: 1.04, duration: 0.05, ease: "power2.out", overwrite: "auto" }, t);
            tl.to(
              sel,
              { scale: 1, duration: 0.12, ease: "power2.out", overwrite: "auto" },
              t + 0.05,
            );
          }

          // ══════ GROUP 1 — poster-tile-mosaic — program: accumulate-then-recolor-on-roll ══════
          // anchors (frame-local, track sec minus 72.0): 1.68, 2.75, 4.02, 4.86, 5.51, 6.6
          // 0.0–1.68 : cold VOID — ink-black ground, nothing on it
          // ACCUMULATE — tiles pop in one at a time, top to bottom
          tl.fromTo(
            "#g1_tile1",
            { autoAlpha: 0, scale: 0.85 },
            { autoAlpha: 1, scale: 1, duration: 0.14, ease: "back.out(1.7)", overwrite: "auto" },
            1.68,
          );
          tl.fromTo(
            "#g1_tile2",
            { autoAlpha: 0, scale: 0.85 },
            { autoAlpha: 1, scale: 1, duration: 0.14, ease: "back.out(1.7)", overwrite: "auto" },
            2.75,
          );
          tl.fromTo(
            "#g1_tile3",
            { autoAlpha: 0, scale: 0.85 },
            { autoAlpha: 1, scale: 1, duration: 0.14, ease: "back.out(1.7)", overwrite: "auto" },
            4.02,
          );
          // RECOLOR ON THE ROLL — the whole wall snaps color as a unit, building to the climax
          recolorWall(4.86, FIRE); // hit 1 — fire-orange
          recolorWall(5.51, CREAM); // hit 2 — snap back to cream
          recolorWall(6.6, FIRE); // hit 3 — locks fire-orange, holds into g2's orange bleed

          // group boundary — 0ms autoAlpha swap
          tl.set("#g1", { autoAlpha: 1 }, 0);
          tl.set("#g2", { autoAlpha: 0 }, 0);
          tl.set("#g3", { autoAlpha: 0 }, 0);
          tl.set("#g1", { autoAlpha: 0 }, 7.877);
          tl.set("#g2", { autoAlpha: 1 }, 7.877);

          // ══════ GROUP 2 — "WHERE THE MONEY MAKES THE KARMA" — the hook lands ══════

          wireIcon("g3", 18.0);

          tl.seek(0);
          window.__timelines["06-f6"] = tl;
        })();
