<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
<style>
        @font-face { font-family: 'Barlow'; font-style: normal; font-weight: 400; font-display: swap; src: url('assets/fonts/barlow-400.woff2') format('woff2'); }
        @font-face { font-family: 'Barlow'; font-style: normal; font-weight: 600; font-display: swap; src: url('assets/fonts/barlow-600.woff2') format('woff2'); }
        @font-face { font-family: 'Barlow'; font-style: normal; font-weight: 700; font-display: swap; src: url('assets/fonts/barlow-700.woff2') format('woff2'); }
        @font-face { font-family: 'Barlow'; font-style: normal; font-weight: 800; font-display: swap; src: url('assets/fonts/barlow-800.woff2') format('woff2'); }
        @font-face { font-family: 'Barlow'; font-style: normal; font-weight: 900; font-display: swap; src: url('assets/fonts/barlow-900.woff2') format('woff2'); }
        @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url('assets/fonts/ibmplexmono-400.woff2') format('woff2'); }
        @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 500; font-display: swap; src: url('assets/fonts/ibmplexmono-500.woff2') format('woff2'); }

        /* ══════════════════════════════════════════════════════════════════
           04-f4 — "TWO ANIMALS, ONE CAGE" / "IT'S A ZOO ON THE FLOOR"
           Broadside register: dark ground, cream text, fire-orange the only
           accent. g1 forks intro-kinetic-cascade (statement treatment).
           g2 forks split-anchor-word-slot, reskinned flat (no torn paper /
           tilt / shadow — 0-radius rectangles + 1px hairlines only).
           ══════════════════════════════════════════════════════════════════ */
        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          background: #111111;
          color: #f0ece5;
          font-family: "Barlow", "Helvetica Neue", Arial, sans-serif;
        }

        #g1,
        #g2 {
          position: absolute;
          inset: 0;
        }

        /* ── g1 — statement register ── */
        #g1_phrase {
          position: absolute;
          left: 106px;
          top: 50%;
          transform: translateY(-50%);
          display: flex;
          flex-direction: column;
          align-items: flex-start;
        }
        .g1-line {
          font-weight: 800;
          font-size: 144px;
          line-height: 0.9;
          letter-spacing: -0.03em;
          text-transform: lowercase;
          color: #f0ece5;
          white-space: nowrap;
        }
        .g1-w {
          display: inline-block;
          opacity: 0;
          will-change: opacity;
        }

        #g1_climax {
          position: absolute;
          left: 106px;
          top: 50%;
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          gap: 14px;
          opacity: 0;
          will-change: transform, opacity;
        }
        .g1c-line {
          font-weight: 800;
          font-size: 144px;
          line-height: 0.9;
          letter-spacing: -0.03em;
          text-transform: lowercase;
          color: #f0ece5;
          white-space: nowrap;
          display: flex;
          align-items: center;
          gap: 0.22em;
        }
        .g1c-kw {
          color: #e85d26;
        }
        #g1_icon {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          width: 108px;
          height: 108px;
          flex-shrink: 0;
          opacity: 0;
          will-change: transform, opacity;
        }
        #g1_icon svg {
          display: block;
          width: 100%;
          height: 100%;
        }
        .g1-ring {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 108px;
          height: 108px;
          border-radius: 50%;
          border: 3px solid rgba(232, 93, 38, 0.55);
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.4);
        }

        /* ── g2 — held anchor + word-slot cycle (flat register) ── */
        #g2_lockup {
          position: absolute;
          left: 106px;
          top: 50%;
          transform: translateY(-50%);
          display: flex;
          align-items: center;
          gap: 44px;
        }
        #g2_anchors {
          display: flex;
          flex-direction: column;
          align-items: flex-start;
        }
        .g2-anchor {
          font-weight: 800;
          font-size: 144px;
          line-height: 0.94;
          letter-spacing: -0.03em;
          text-transform: lowercase;
          color: #f0ece5;
          white-space: nowrap;
          opacity: 0;
          will-change: transform, opacity;
        }
        #g2_slotbox {
          position: relative;
          border: 1px solid #282826;
          padding: 18px 34px;
          min-width: 300px;
          opacity: 0;
          will-change: transform, opacity;
        }
        #g2_slotwords {
          position: relative;
          display: grid;
        }
        .g2-word {
          grid-area: 1 / 1;
          font-weight: 800;
          font-size: 144px;
          line-height: 0.94;
          letter-spacing: -0.03em;
          text-transform: lowercase;
          color: #e85d26;
          white-space: nowrap;
          opacity: 0;
          will-change: transform, opacity;
        }
      </style>

      <div
        id="root"
        data-composition-id="04-f4"
        data-width="1920"
        data-height="1080"
        data-duration="9.0"
        data-fps="30"
      >
        <!-- ══ g1 — intro-kinetic-cascade fork ══ -->
        <div id="g1">
          <div id="g1_phrase">
            <div class="g1-line">
              <span class="g1-w" id="g1_w0">two</span> <span class="g1-w" id="g1_w1">animals,</span>
            </div>
            <div class="g1-line">
              <span class="g1-w" id="g1_w2">one</span> <span class="g1-w" id="g1_w3">cage—</span>
            </div>
          </div>
          <div id="g1_climax">
            <div class="g1c-line">somebody's getting</div>
            <div class="g1c-line">
              <span id="g1_icon"
                ><span class="g1-ring" id="g1_ring1"></span><span class="g1-ring" id="g1_ring2"></span
                ><svg viewBox="0 0 24 24" fill="#e85d26">
                  <path
                    d="M12 1.8l2.1 6.9 6.9 2.1-6.9 2.1L12 19.8l-2.1-6.9L3 10.8l6.9-2.1z"
                  /></svg
              ></span>
              <span class="g1c-kw">retired.</span>
            </div>
          </div>
        </div>

        <!-- ══ g2 — split-anchor-word-slot fork ══ -->
        <div id="g2">
          <div id="g2_lockup">
            <div id="g2_anchors">
              <div class="g2-anchor" id="g2_a0">it's a zoo</div>
              <div class="g2-anchor" id="g2_a1">on the floor</div>
            </div>
            <div id="g2_slotbox">
              <div id="g2_slotwords">
                <div class="g2-word" id="g2_s0">yeah</div>
                <div class="g2-word" id="g2_s1">we</div>
                <div class="g2-word" id="g2_s2">speak</div>
                <div class="g2-word" id="g2_s3">in</div>
                <div class="g2-word" id="g2_s4">the</div>
                <div class="g2-word" id="g2_s5">fauna</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          var g1 = document.getElementById("g1");
          var g2 = document.getElementById("g2");

          // ── initial (deterministic) DOM state ──
          gsap.set(g1, { autoAlpha: 1 });
          gsap.set(g2, { autoAlpha: 0 });

          var g1Words = ["#g1_w0", "#g1_w1", "#g1_w2", "#g1_w3"];
          gsap.set(g1Words, { opacity: 0 });
          gsap.set("#g1_phrase", { opacity: 0 });

          gsap.set("#g1_climax", { opacity: 0, x: 90, yPercent: -50 });
          gsap.set("#g1_icon", { opacity: 0, scale: 0.4, rotation: -8 });
          gsap.set(["#g1_ring1", "#g1_ring2"], { opacity: 0, scale: 0.4 });

          var g2Anchors = ["#g2_a0", "#g2_a1"];
          gsap.set(g2Anchors, { autoAlpha: 0, y: 24, scale: 0.9 });
          gsap.set("#g2_slotbox", { autoAlpha: 0, scale: 0.92 });
          var g2Words = ["#g2_s0", "#g2_s1", "#g2_s2", "#g2_s3", "#g2_s4", "#g2_s5"];
          gsap.set(g2Words, { autoAlpha: 0, x: 60 });

          var tl = gsap.timeline({ paused: true });

          // ══════════════════════════════════════════════════════════════
          //  g1 — 0.0 → 4.219  (local time; frame starts at track 50.0)
          // ══════════════════════════════════════════════════════════════

          // phrase A cascades word-by-word, then hard-cuts before the climax.
          var PHRASE_TIMES = [0.06, 0.83, 1.8, 2.57];
          tl.to("#g1_phrase", { opacity: 1, duration: 0.01, overwrite: "auto" }, PHRASE_TIMES[0]);
          g1Words.forEach(function (sel, i) {
            tl.to(sel, { opacity: 1, duration: 0.18, ease: "power2.out", overwrite: "auto" }, PHRASE_TIMES[i]);
          });
          var CLIMAX_IN = 3.48;
          tl.to(
            "#g1_phrase",
            { opacity: 0, duration: 0.1, ease: "power2.in", overwrite: "auto" },
            CLIMAX_IN - 0.1,
          );

          // climax slides in in place (left-anchored), then the icon pops + rings.
          tl.to(
            "#g1_climax",
            { x: 0, opacity: 1, duration: 0.42, ease: "power3.out", overwrite: "auto" },
            CLIMAX_IN,
          );
          var ICON_AT = 4.1;
          tl.to("#g1_icon", { opacity: 1, duration: 0.3, ease: "power3.out", overwrite: "auto" }, ICON_AT);
          tl.fromTo(
            "#g1_icon",
            { scale: 0.4, rotation: -8 },
            { scale: 1, rotation: 0, duration: 0.35, ease: "back.out(2.4)", overwrite: "auto" },
            ICON_AT + 0.02,
          );
          tl.fromTo(
            ["#g1_ring1", "#g1_ring2"],
            { scale: 0.4, opacity: 0.55 },
            { scale: 1.5, opacity: 0, duration: 0.8, ease: "power2.out", stagger: 0.08, overwrite: "auto" },
            ICON_AT + 0.05,
          );

          // ── group boundary — 0ms hard cut ──
          var BOUNDARY = 4.219;
          tl.set("#g1", { autoAlpha: 0 }, BOUNDARY);
          tl.set("#g2", { autoAlpha: 1 }, BOUNDARY);

          // ══════════════════════════════════════════════════════════════
          //  g2 — 4.219 → 9.0  (local time)
          // ══════════════════════════════════════════════════════════════

          // lockup: the held anchor column pops in, then the slot box reveals.
          tl.fromTo(
            "#g2_a0",
            { autoAlpha: 0, y: 24, scale: 0.9 },
            { autoAlpha: 1, y: 0, scale: 1, duration: 0.2, ease: "expo.out", overwrite: "auto" },
            4.3,
          );
          tl.fromTo(
            "#g2_a1",
            { autoAlpha: 0, y: 24, scale: 0.9 },
            { autoAlpha: 1, y: 0, scale: 1, duration: 0.2, ease: "expo.out", overwrite: "auto" },
            4.42,
          );
          tl.fromTo(
            "#g2_slotbox",
            { autoAlpha: 0, scale: 0.92 },
            { autoAlpha: 1, scale: 1, duration: 0.2, ease: "back.out(1.8)", overwrite: "auto" },
            4.46,
          );

          // word-slot cycle — one word at a time, whipping in on each onset.
          var SLOT_STEPS = [
            { sel: "#g2_s0", enter: 4.5, exit: 5.16 },
            { sel: "#g2_s1", enter: 5.26, exit: 5.95 },
            { sel: "#g2_s2", enter: 6.05, exit: 6.74 },
            { sel: "#g2_s3", enter: 6.84, exit: 7.62 },
            { sel: "#g2_s4", enter: 7.82, exit: 8.57 },
            { sel: "#g2_s5", enter: 8.77, exit: null }, // holds to the hard stop
          ];
          SLOT_STEPS.forEach(function (step) {
            tl.fromTo(
              step.sel,
              { autoAlpha: 0, x: 60 },
              { autoAlpha: 1, x: 0, duration: 0.16, ease: "expo.out", overwrite: "auto" },
              step.enter,
            );
            if (step.exit != null) {
              tl.to(
                step.sel,
                { autoAlpha: 0, x: -40, duration: 0.14, ease: "power2.in", overwrite: "auto" },
                step.exit,
              );
            }
          });

          // ── pad to the frame's fixed 9.0s length, then park at t=0 ──
          tl.to({}, { duration: 0.001 }, 9.0);
          tl.seek(0);

          window.__timelines["04-f4"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
